<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Article — Serendipity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--cyan" aria-hidden="true"></div>
  <div class="bg-glow bg-glow--magenta" aria-hidden="true"></div>
  <div class="scanlines" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="index.html" data-text="Serendipity//">Serendipity//</a>
    <nav class="nav" aria-label="Primary">
      <a href="index.html#guides">GUIDES</a>
      <a href="index.html#blog">BLOG</a>
      <a href="admin.html">WRITE</a>
      <a href="index.html#about">ABOUT</a>
      <a href="index.html#contact">CONTACT</a>
    </nav>
    <a class="btn btn--ghost nav-cta" href="index.html#contact">INITIALIZE</a>
  </header>

  <main class="post-page">
    <div id="post-root"></div>
  </main>

  <footer class="site-footer">
    <span>© 2077 SERENDIPITY — ALL SIGNALS RESERVED</span>
    <div class="footer-links">
      <a href="index.html#top">GITHUB</a>
      <a href="index.html#top">TWITTER</a>
      <a href="index.html#top">RSS</a>
    </div>
  </footer>

  <div class="music-player" aria-label="Music player">
    <button class="mp-skip" id="mp-prev" type="button" aria-label="Previous">⏮</button>
    <button class="mp-play" id="mp-play" type="button" aria-label="Play or pause">▶</button>
    <button class="mp-skip" id="mp-next" type="button" aria-label="Next">⏭</button>
    <div class="mp-eq" id="mp-eq" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
    <div class="mp-info">
      <span class="mp-title" id="mp-title">—</span>
      <span class="mp-artist" id="mp-artist">—</span>
    </div>
    <div class="mp-progress" id="mp-progress"><div class="mp-progress__fill" id="mp-progress-fill"></div></div>
    <div class="mp-time"><span id="mp-cur">0:00</span> / <span id="mp-dur">0:00</span></div>
    <div class="mp-volume">
      <span class="mp-vol-icon">♪</span>
      <input type="range" id="mp-vol" min="0" max="1" step="0.01" value="0.8" />
    </div>
  </div>

  <script src="posts-data.js"></script>
  <script src="posts.js"></script>
  <script src="post.js"></script>
  <script src="music-player.js"></script>
</body>
</html>
